<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section}, ${viewType == 'featured' ? 'Featured Projects' : 'All Projects'})}">

<section>
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4 animate-fade-in">
        <div>
            <h1 class="h2 fw-bold mb-2">
                <i th:class="${viewType == 'featured' ? 'bi bi-star-fill' : 'bi bi-folder-fill'}"></i>
                <span th:text="${viewType == 'featured' ? 'Featured Projects' : 'All Projects'}">Projects</span>
            </h1>
            <p class="text-muted mb-0" th:text="${viewType == 'featured' ? 'Your highlighted portfolio items' : 'Complete list of your portfolio projects'}">Projects list</p>
        </div>
        <a th:href="@{/admin}" class="btn btn-outline-primary">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(projects)}" class="text-center py-5 animate-fade-in">
        <div class="card shadow-sm">
            <div class="card-body p-5">
                <i class="bi bi-folder-x" style="font-size: 5rem; opacity: 0.2; color: var(--primary);"></i>
                <h3 class="h4 mt-4 mb-3">No Projects Found</h3>
                <p class="text-muted mb-4" th:text="${viewType == 'featured' ? 'You haven\'t featured any projects yet.' : 'Start building your portfolio by adding your first project.'}">No projects message</p>
                <a th:href="@{/admin/projects/new}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Add Your First Project
                </a>
            </div>
        </div>
    </div>

    <!-- Projects Grid -->
    <div th:unless="${#lists.isEmpty(projects)}" class="row g-4">
        <div th:each="project, iterStat : ${projects}" class="col-lg-4 col-md-6">
            <div class="card shadow-sm h-100 animate-fade-in project-card" th:style="'animation-delay: ' + ${iterStat.index * 0.1} + 's'">

                <!-- Project Image -->
                <div class="project-image-container" style="height: 200px; overflow: hidden; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); position: relative;">
                    <img th:if="${project.imageUrl}"
                         th:src="${project.imageUrl}"
                         th:alt="${project.title}"
                         class="w-100 h-100"
                         style="object-fit: cover;">
                    <div th:unless="${project.imageUrl}" class="d-flex align-items-center justify-content-center h-100" style="color: white; font-size: 3rem;">
                        <i class="bi bi-image"></i>
                    </div>

                    <!-- Featured Badge -->
                    <span th:if="${project.featured}" class="badge position-absolute top-0 end-0 m-3"
                          style="background: linear-gradient(135deg, #ec4899 0%, #f472b6 100%);">
                        <i class="bi bi-star-fill"></i> Featured
                    </span>
                </div>

                <div class="card-body d-flex flex-column">
                    <!-- Title -->
                    <h5 class="card-title fw-bold mb-2" th:text="${project.title}">Project Title</h5>

                    <!-- Subtitle -->
                    <p class="text-muted small mb-3" th:if="${project.subtitle}" th:text="${project.subtitle}">Subtitle</p>

                    <!-- Description -->
                    <p class="card-text text-muted mb-3" th:text="${project.shortDescription}">Short description</p>

                    <!-- Tech Stack -->
                    <div class="mb-3" th:if="${project.techStack}">
                        <div class="d-flex flex-wrap gap-2">
                            <span th:each="tech : ${project.techStack.split(',')}"
                                  class="badge"
                                  style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);"
                                  th:text="${tech.trim()}">
                                Tech
                            </span>
                        </div>
                    </div>

                    <!-- Links -->
                    <div class="mt-auto">
                        <div class="d-flex gap-2 mb-3" th:if="${project.githubUrl || project.liveUrl}">
                            <a th:if="${project.githubUrl}"
                               th:href="${project.githubUrl}"
                               target="_blank"
                               class="btn btn-sm btn-outline-dark flex-fill">
                                <i class="bi bi-github"></i> Code
                            </a>
                            <a th:if="${project.liveUrl}"
                               th:href="${project.liveUrl}"
                               target="_blank"
                               class="btn btn-sm btn-outline-primary flex-fill">
                                <i class="bi bi-box-arrow-up-right"></i> Live
                            </a>
                        </div>

                        <!-- Actions -->
                        <div class="d-flex gap-2 pt-3 border-top">
                            <a th:href="@{'/admin/projects/' + ${project.id} + '/edit'}"
                               class="btn btn-outline-primary btn-sm flex-fill">
                                <i class="bi bi-pencil-fill"></i> Edit
                            </a>
                            <form th:action="@{'/admin/projects/' + ${project.id} + '/delete'}"
                                  method="post"
                                  class="flex-fill"
                                  onsubmit="return confirm('Are you sure you want to delete this project?');">
                                <button type="submit" class="btn btn-outline-danger btn-sm w-100">
                                    <i class="bi bi-trash-fill"></i> Delete
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<style>
    .project-card {
        transition: all 0.3s ease;
    }

    .project-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 35px rgba(0,0,0,0.15) !important;
    }

    [data-theme="dark"] .project-card {
        background: var(--card-bg);
        border-color: var(--border);
    }

    [data-theme="dark"] .project-card:hover {
        border-color: var(--primary);
    }

    .project-image-container img {
        transition: transform 0.3s ease;
    }

    .project-card:hover .project-image-container img {
        transform: scale(1.05);
    }
</style>
</html>
