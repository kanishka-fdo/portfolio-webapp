<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content, title)">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} ?: 'Kanishka Fernando — Full-Stack Developer'">Portfolio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    
    <link th:href="@{/css/styles.css}" rel="stylesheet">

    <style>
        body {
            background-color: var(--bg-black);
            color: var(--text-body);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex-grow: 1;
            padding-top: 115px;
            padding-bottom: 80px;
        }

        footer {
            border-top: 1px solid var(--line-strong);
            padding: 30px 0;
            background: rgba(10, 10, 15, 0.95);
            color: var(--text-secondary);
            font-size: 0.92rem;
        }

        footer a {
            color: var(--text-secondary) !important;
            transition: var(--transition-smooth);
        }

        footer a:hover {
            color: #ffffff !important;
        }
    </style>
</head>
<body>

<header class="pop-navbar">
    <div class="container d-flex justify-content-between align-items-center">
        <a th:href="@{/} + '#hero'" class="navbar-brand-logo">
            <span class="brand-dot"></span>
            <span th:text="${cv != null ? cv.fullName : 'Kanishka Fernando'}">Kanishka Fernando</span>
        </a>

        <div class="nav-pill-group d-none d-md-flex">
            <a th:href="@{/}" class="nav-pill-item">Home</a>
            <a th:href="@{/projects}" class="nav-pill-item">Projects</a>
            <a th:href="@{/about}" class="nav-pill-item">About</a>
            <a th:href="@{/contact}" class="nav-pill-item">Contact</a>
            <a th:href="@{/admin}" class="nav-pill-item">Admin</a>
        </div>

        <a th:href="@{/contact}" class="btn-pop-primary py-2 px-4 d-none d-sm-inline-flex" style="font-size: 0.85rem;">
            <span>Get in Touch</span>
            <i class="bi bi-chat-text-fill"></i>
        </a>
    </div>
</header>

<main class="container">
    <th:block th:replace="${content}"></th:block>
</main>

<footer>
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
        <div>
            © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2026</span> Kanishka Fernando · SLIIT ISE Undergrad.
        </div>
        <div class="d-flex gap-4">
            <a th:href="@{/}" class="text-muted text-decoration-none">Home</a>
            <a th:href="@{/about}" class="text-muted text-decoration-none">About</a>
            <a th:href="@{/projects}" class="text-muted text-decoration-none">Projects</a>
            <a th:href="@{/contact}" class="text-muted text-decoration-none">Contact</a>
            <a th:href="@{/admin}" class="text-muted text-decoration-none">Admin</a>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/animations.js}"></script>
</body>
</html>
